plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'

    // Added test dependencies for JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}
// Task to copy custom HTML into reports/
tasks.register('copyHtml', Copy) {
	from('src/main/html')
	into layout.buildDirectory.dir('reports')
} 

// Task to copy JavaDoc into reports/
tasks.register('copyJavaDoc', Copy) {
	dependsOn tasks.named('javadoc')
	from(layout.buildDirectory.dir('docs/javadoc'))
	into layout.buildDirectory.dir('reports/javadoc')
}

// Main reports task
task reports(dependsOn: ['build', 'copyHtml', 'copyJavaDoc']){
}

// Define the location for the temporary working tree
def pagesDir = file("${project.rootDir}/build/website-temp").absolutePath

// Step 1: Clean up any broken state from previous runs
tasks.register('clearPages', Delete) {
    delete pagesDir
}

// Step 2: Establish the Git Worktree
tasks.register('workTreeAdd', Exec) {
    dependsOn 'clearPages'
    workingDir = '.'
    commandLine = ['git', 'worktree', 'add', '-f', pagesDir, 'gh-pages']
}

// Step 3: Pull the latest tracking states
tasks.register('workTreePull', Exec) {
    dependsOn 'workTreeAdd'
    workingDir = pagesDir
    commandLine = ['git', 'pull', 'origin', 'gh-pages']
    ignoreExitValue = true 
}

// Step 4: The copy tasks
tasks.register('copyReports', Copy) {
    dependsOn 'reports', 'workTreePull'
    from 'build/reports'
    into pagesDir
}

tasks.register('copyWebsite', Copy) {
    dependsOn 'copyReports'
    from file('src/main/html')
    into pagesDir
}

// Step 5: Automatically generate index.html from index.md contents
tasks.register('generateHtmlIndex') {
    dependsOn 'copyWebsite'
    
    doLast {
        def mdFile = file("src/main/html/index.md")
        def htmlFile = file("${pagesDir}/index.html")
        
        if (mdFile.exists()) {
            // Read lines and strip out basic Markdown patterns to produce a clean HTML fallback
            def htmlContent = """<!DOCTYPE html>
<html>
<head>
    <title>Project Reports</title>
    <style>body { font-family: sans-serif; margin: 40px; line-height: 1.6; }</style>
</head>
<body>
"""
            mdFile.eachLine { line ->
                if (line.startsWith('# ')) {
                    htmlContent += "    <h1>${line.substring(2)}</h1>\n"
                } else if (line.trim().startsWith('* ')) {
                    // Extract link details: * [Name](URL) -> <li><a href="URL">Name</a></li>
                    def matcher = line =~ /\* \[(.*)\]\((.*)\)/
                    if (matcher.find()) {
                        htmlContent += "    <li><a href=\"${matcher[0][2]}\">${matcher[0][1]}</a></li>\n"
                    } else {
                        htmlContent += "    <li>${line.substring(2)}</li>\n"
                    }
                } else if (!line.trim().isEmpty()) {
                    htmlContent += "    <p>${line}</p>\n"
                }
            }
            
            htmlContent += "</body>\n</html>"
            htmlFile.text = htmlContent
        }
    }
}

// Step 6: Consolidate Staging, Committing, and Pushing
tasks.register('pushWebsite', Exec) {
    dependsOn 'generateHtmlIndex'
    def timestamp = new Date().format("yyyy-MM-dd HH:mm:ss")
    
    commandLine 'sh', '-c', """
        cd "${pagesDir}"
        
        # Override project root .gitignore constraints on the 'build' path folder
        git add -f .
        
        if ! git diff --cached --quiet; then
            git commit -m "Updating webpages at ${timestamp}"
        else
            git commit --allow-empty -m "Automated build run at ${timestamp}"
        fi
        
        git push origin gh-pages
    """
    ignoreExitValue = false
}

// Step 7: The Target Task (Clean up and finish)
tasks.register('deployReports', Exec) {
    group = "Reporting"
    description = "Commit and push website changes to GitHub gh-pages branch"
    dependsOn 'pushWebsite'
    workingDir = '.'
    commandLine 'sh', '-c', """
        rm -rf "${pagesDir}"
        git worktree prune
    """
}



application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}



